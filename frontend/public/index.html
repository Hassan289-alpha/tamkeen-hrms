<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="Tamkeen IT Services - Modern HRMS, Dynamic Attendance & Leave Portal" />
    <title>Tamkeen IT Portal • Modern HRMS & Attendance Suite</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
                950: '#090d16'
              }
            },
            boxShadow: {
              'white-glow': '0 0 25px -3px rgba(255, 255, 255, 0.18), 0 8px 30px rgba(0, 0, 0, 0.4)',
              'white-card': '0 10px 40px -10px rgba(255, 255, 255, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.14)',
              'white-subtle': '0 4px 20px -2px rgba(255, 255, 255, 0.08), 0 2px 6px rgba(0, 0, 0, 0.3)',
              'white-button': '0 0 20px 0 rgba(255, 255, 255, 0.25)',
              'white-float': '0 20px 40px -15px rgba(255, 255, 255, 0.15)'
            }
          }
        }
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #090d16;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #090d16;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
      /* Glassmorphism & Animations with Luminous White Shadows */
      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 32px 0 rgba(255, 255, 255, 0.08);
      }
      .white-glow {
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.16);
      }
      .white-shadow-card {
        box-shadow: 0 10px 30px -5px rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.15);
      }
      .white-shadow-elevated {
        box-shadow: 0 20px 45px -10px rgba(255, 255, 255, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.2);
      }
      .glass-glow-indigo {
        box-shadow: 0 0 40px -8px rgba(99, 102, 241, 0.35), 0 0 20px rgba(255, 255, 255, 0.1);
      }
      .glass-glow-amber {
        box-shadow: 0 0 40px -8px rgba(245, 158, 11, 0.35), 0 0 20px rgba(255, 255, 255, 0.1);
      }
      .glass-glow-emerald {
        box-shadow: 0 0 40px -8px rgba(16, 185, 129, 0.35), 0 0 20px rgba(255, 255, 255, 0.1);
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animate-float {
        animation: floatSlow 4s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-[#090d16] text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
  </body>
</html>
